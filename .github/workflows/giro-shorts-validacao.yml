name: Giro Madeira - validar fallback editorial (sem publicacao)
on:
  push:
    paths:
      - '.github/workflows/giro-shorts-validacao.yml'
      - 'scripts/giro_shorts_auto.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-arte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=11,<13"
      - name: Validar fallback original isolado, sem credenciais ou upload
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from PIL import Image, ImageDraw
          import re
          p=Path("scripts/giro_shorts_auto.py")
          source=p.read_text(encoding="utf-8")
          ast.parse(source)
          tree=ast.parse(source)
          fn=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="render_text_only_background"),None)
          assert fn is not None, "QA-only fallback missing"
          scope={"Image":Image,"ImageDraw":ImageDraw,"W":1080,"H":1920,"NAVY":(4,17,40),"YELLOW":(255,212,0)}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),str(p),"exec"),scope)
          picture=scope["render_text_only_background"]("POLÍTICA")
          assert picture.size==(1080,1920) and picture.mode=="RGB"
          assert len(set(picture.resize((54,96)).getdata()))>5, "Empty image"
          main=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="main")
          assert not any(isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=="render_text_only_background" for n in ast.walk(main)), "Generic fallback must NOT publish"
          assert "aircraft airplane" in source, "Aircraft subject mapping missing"
          assert "No source-linked photograph with a verifiable reuse license" in source, "Original-event license gate missing"
          assert 'ORIGINAL_CREDIT="arte editorial original Giro Madeira — sem fotografia externa"' in source
          assert 'image_verified=credit.startswith(("wikimedia_event_","original_editorial_labeled_"))' in source, "Original artwork must have explicit provenance"
          fn_topic=next((n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="render_topic_illustration"),None)
          assert fn_topic is not None, "Topic-specific visual fallback missing"
          scope["clean"]=lambda s: re.sub(r"\\s+"," ",str(s or "")).strip()
          scope["re"]=re
          exec(compile(ast.Module(body=[fn_topic],type_ignores=[]),str(p),"exec"),scope)
          child_protection=scope["render_topic_illustration"]("PF combate crimes contra crianças na internet","SEGURANÇA")
          electrical_grid=scope["render_topic_illustration"]("Ataques deixam Ucrânia sem energia","MUNDO")
          assert child_protection.size==(1080,1920) and electrical_grid.size==(1080,1920)
          assert child_protection.tobytes()!=picture.tobytes(), "Child-safety scene not topical"
          assert electrical_grid.tobytes()!=child_protection.tobytes(), "Distinct headlines got same visual"
          assert "len(frames)==3" in source, "Three-scene verification missing"
          assert 'picture,credit,file_title=licensed_event_photo(result["source_url"],result["title"])' in source
          print("PASS: licensed photographs prioritized; relevant labeled original art verified when necessary; no upload invoked")
          PY
