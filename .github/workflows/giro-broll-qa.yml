name: Giro Madeira - QA das imagens ilustrativas (manual, sem publicar)

on:
  workflow_dispatch:
  push:
    branches: [giro-capa-impacto]
    paths: [scripts/giro_broll.py, .github/workflows/giro-broll-qa.yml]

permissions:
  contents: write

jobs:
  broll-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3"
      - name: Buscar imagens de licença aberta (teste, sem publicar)
        run: python scripts/giro_broll.py broll-teste
      - name: Guardar resultado num ramo de teste (para conferir)
        run: |
          git config user.name "giro-qa"; git config user.email "qa@users.noreply.github.com"
          git checkout --orphan giro-broll-qa-out
          git rm -rf -q . || true
          cp -r broll-teste/* . 
          git add relatorio.json *.jpg 2>/dev/null || git add relatorio.json
          git commit -q -m "resultado QA broll"
          git push -f origin giro-broll-qa-out
