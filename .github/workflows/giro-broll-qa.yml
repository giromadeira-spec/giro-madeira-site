name: Giro Madeira - QA das imagens ilustrativas (manual, sem publicar)

on:
  workflow_dispatch:
  push:
    branches: [giro-capa-impacto]
    paths: [scripts/giro_broll.py, .github/workflows/giro-broll-qa.yml]

permissions:
  contents: read

jobs:
  broll-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3"
      - name: Buscar imagens de licença aberta (teste, sem publicar)
        run: python scripts/giro_broll.py broll-teste
      - uses: actions/upload-artifact@v4
        with:
          name: giro-broll-qa
          path: broll-teste
