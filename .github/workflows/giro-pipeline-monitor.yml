name: Giro Madeira - confirmação operacional (somente leitura)
on:
  schedule:
    # After the 45-minute publication window at 08h/22h Porto Velho.
    - cron: '50 2,12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: giro-pipeline-monitor
  cancel-in-progress: false
jobs:
  confirmar-entregas:
    if: github.repository == 'giromadeira-spec/giro-madeira-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.34.2'
      - name: Conferir IDs públicos e bloqueios por canal, sem publicar
        run: python scripts/giro_pipeline_monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: giro-pipeline-status
          path: artifacts/pipeline-status.json
          if-no-files-found: warn
          retention-days: 14
