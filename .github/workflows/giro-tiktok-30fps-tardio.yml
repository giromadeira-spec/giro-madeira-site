name: Giro Madeira - TikTok 30fps tardio (segunda chance)
# Segunda chance do TikTok (autorizado por Gilson em 01/11/2026): vídeo aprovado depois das passagens de
# 16:15/16:35/16:50 PV ainda recebe a cópia 30 fps. Só converte item já aprovado pela conferência; NÃO publica.
# Publicação continua só pelo claim do banco (1 por dia, janela 17h-22h PV, mesmas travas editoriais).
# Passagens a cada 30 min entre 17:50 e 21:50 PV (21:50Z até 01:50Z).
on:
  schedule:
    - cron: '50 21 * * *'
    - cron: '20,50 22,23,0,1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: giro-tiktok-30fps-tardio
  cancel-in-progress: false
jobs:
  converter-tiktok:
    if: github.repository == 'giromadeira-spec/giro-madeira-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg e bibliotecas
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3"
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg; }
          command -v ffprobe
      - name: Preparar cópia TikTok em 30 fps (somente item já aprovado)
        run: python scripts/buffer/giro_tiktok_30fps.py
