name: Giro Madeira - Demo de motion graphics (teste, sem publicar)

on:
  push:
    branches: [giro-demo-motion]
    paths: [.github/workflows/giro-demo-motion.yml, scripts/demo.json, scripts/demo_motion.py]

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências gratuitas
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3" numpy
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check kokoro soundfile
      - name: Montar o vídeo de demonstração
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/demo_motion.py scripts/demo.json demo-out
      - name: Guardar resultado num ramo de teste
        run: |
          git config user.name "giro-qa"; git config user.email "qa@users.noreply.github.com"
          git checkout --orphan giro-demo-out
          git rm -rf -q . || true
          cp demo-out/demo.mp4 demo-out/demo.mp4.cover.png demo-out/relatorio.json . 
          git add demo.mp4 demo.mp4.cover.png relatorio.json
          git commit -q -m "demo motion graphics"
          git push -f origin giro-demo-out
