name: Giro Madeira - TikTok reconciliation QA (no publication)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/buffer/giro-buffer-tiktok-worker.ts'
      - 'tests/test_tiktok_reconcile.mjs'
      - '.github/workflows/giro-tiktok-reconciliacao-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate existing-delivery recovery and channel isolation offline
        run: node tests/test_tiktok_reconcile.mjs
