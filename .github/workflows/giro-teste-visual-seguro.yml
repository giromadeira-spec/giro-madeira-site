name: Giro Madeira - Teste visual seguro (sem publicar)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giro-madeira-qa-manual
  cancel-in-progress: false

jobs:
  validar-renderizador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias e sintaxe
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m py_compile scripts/giro_shorts_auto.py
      - name: Simular capa e video sem acesso a redes sociais
        env:
          GITHUB_EVENT_NAME: push
        run: python scripts/giro_shorts_auto.py --self-test
      - name: Anexar capa e video
        uses: actions/upload-artifact@v4
        with:
          name: giro-madeira-qa-manual-sem-publicar
          path: |
            shorts-test-preview/auto-qa-cover.png
            shorts-test-preview/auto-qa-video.mp4
          if-no-files-found: error
          retention-days: 3
