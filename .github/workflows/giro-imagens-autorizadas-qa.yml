name: Giro Madeira - banco de imagens (teste seguro)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'supabase/functions/giro-shorts-github-bridge/index.ts'
      - 'supabase/functions/giro-shorts-preparar-storyboard/**'
      - 'supabase/functions/giro-shorts-editorial-queue/**'
      - 'supabase/functions/giro-tiktok-editorial-queue/**'
      - 'supabase/functions/giro-tiktok-preparar-storyboard/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/gerar-arte-noticia-vault/**'
      - 'supabase/functions/giro-instagram-preparar-independente/**'
      - 'tests/test_instagram_original_art.mjs'
      - 'tests/test_instagram_story_pilot.mjs'
      - 'tests/test_instagram_delivery.mjs'
      - 'tests/test_video_early_review.mjs'
      - '.github/workflows/giro-shorts-producao.yml'
      - '.github/workflows/giro-tiktok-producao.yml'
      - 'supabase/functions/giro-youtube-upload-auto/index.ts'
      - 'supabase/functions/giro-tiktok-github-bridge/index.ts'
      - 'supabase/functions/giro-tiktok-30fps-bridge/index.ts'
      - 'scripts/buffer/giro-buffer-tiktok-worker.ts'
      - 'tests/test_tiktok_photo_guard.py'
      - 'scripts/giro_shorts_auto.py'
      - 'tests/test_giro_event_images.py'
      - '.github/workflows/giro-imagens-autorizadas-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar sintaxe e tipos das funções Supabase sem deploy
        run: |
          deno check supabase/functions/giro-shorts-github-bridge/index.ts
          deno check supabase/functions/giro-shorts-preparar-storyboard/index.ts
          deno check supabase/functions/giro-shorts-editorial-queue/index.ts
          deno check supabase/functions/giro-tiktok-editorial-queue/index.ts
          deno check supabase/functions/giro-tiktok-preparar-storyboard/index.ts
          deno check supabase/functions/giro-youtube-upload-auto/index.ts
          deno check supabase/functions/giro-tiktok-github-bridge/index.ts
          deno check supabase/functions/giro-tiktok-30fps-bridge/index.ts
          deno check scripts/buffer/giro-buffer-tiktok-worker.ts
          deno check supabase/functions/gerar-arte-noticia-vault/index.ts
          deno check supabase/functions/giro-instagram-preparar-independente/index.ts
          deno check supabase/functions/giro-instagram-publicar-independente/index.ts
      - name: Validar contrato de arte original sem publicar
        run: node --experimental-strip-types tests/test_instagram_original_art.mjs
      - name: Validar piloto Story e formatos independentes sem publicar
        run: |
          node --experimental-strip-types tests/test_instagram_delivery.mjs
          node --experimental-strip-types tests/test_instagram_story_pilot.mjs
      - name: Validar antecipação de MP4 e revisão por canal sem publicar
        run: node --experimental-strip-types tests/test_video_early_review.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar renderizador e licença com imagens simuladas (sem API social)
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'requests>=2.31,<3'
          python -m py_compile scripts/giro_shorts_auto.py
          python -m unittest discover -s tests -p 'test_giro_event_images.py' -v
          python -m unittest discover -s tests -p 'test_tiktok_photo_guard.py' -v
      - name: Garantir que mídias do banco não contornam revisão editorial
        run: |
          python - <<'PY'
          from pathlib import Path
          bridge=Path('supabase/functions/giro-shorts-github-bridge/index.ts').read_text()
          uploader=Path('supabase/functions/giro-youtube-upload-auto/index.ts').read_text()
          assert 'registryReady(registered)' in bridge
          assert 'registryCredit(registered)!==imageCredit' in bridge
          assert 'editor_approved:false' in bridge
          assert 'ready_to_publish:false' in bridge
          assert 'registered_photo_rights_not_verified_at_publication' in uploader
          assert '.eq("editor_approved",true)' in uploader
          assert '.eq("visual_review_status","approved")' in uploader
          tiktok=Path('supabase/functions/giro-tiktok-github-bridge/index.ts').read_text()
          assert 'editor_approved:!isIllustration' in tiktok
          assert 'visual_review_status:isIllustration?"pending":"approved"' in tiktok
          assert 'ready_to_publish:!isIllustration' in tiktok
          assert 'illustration_source_mismatch' in tiktok
          assert 'originalArtCredit' in bridge
          assert 'originalArtCredit' in uploader
          assert 'illustration_provenance_mismatch' in uploader
          print('PASS: registered photos require documented rights and human editorial approval')
          PY
