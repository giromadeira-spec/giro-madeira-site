name: Giro Madeira - Reels QA sem Railway

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/giro-reels-render-actions.yml
      - scripts/giro_reels_qa_actions.py
      - scripts/giro_reels_226_kokoro.py
  workflow_dispatch:
    inputs:
      reel_id:
        description: 'ID do Reel (vazio = proximo)'
        required: false
        default: ''
      modo:
        description: 'motion = motion graphics + voz pm_alex (QA)'
        required: false
        default: 'motion'
  workflow_run:
    workflows:
      - "Giro Madeira - Shorts (sem API paga)"
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: giro-reels-render-qa
  cancel-in-progress: false

jobs:
  renderizar-um-reel-sem-publicar:
    if: ${{ github.repository == 'giromadeira-spec/giro-madeira-site' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código e não tocar no Railway
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências gratuitas FFmpeg e narração local
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check "requests>=2.31,<3"
          python -m py_compile scripts/giro_reels_qa_actions.py
          ffmpeg -version | head -1
      - name: Instalar Kokoro TTS para teste 226
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'kokoro==0.9.4' 'soundfile>=0.12,<1' 'Pillow>=11,<13'
          python -m py_compile scripts/giro_reels_226_kokoro.py
      - name: Gerar exatamente um Reel MP4 em QA sem aprovação nem publicação
        env:
          GIRO_TEST_REEL_ID: ${{ github.event_name == 'push' && '226' || '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GIRO_REEL_EXEMPLO="${{ github.event.inputs.modo == 'exemplo' && '1' || '0' }}" GIRO_TEST_REEL_ID="${{ github.event.inputs.reel_id }}" python scripts/giro_reels_motion.py
          elif [ "${{ github.event_name }}" = "push" ]; then
            python scripts/giro_reels_226_kokoro.py
          else
            # workflow_run (apos o Short): tambem usa o Reel motion com imagens por cena e voz pm_alex
            python scripts/giro_reels_motion.py
          fi
      - name: Guardar video de teste numa branch de QA (so disparo manual)
        if: github.event_name == 'workflow_dispatch' && hashFiles('reel-motion-qa/reel-motion.mp4') != ''
        run: |
          git config user.name "giro-qa"; git config user.email "qa@users.noreply.github.com"
          mkdir -p /tmp/qa && cp reel-motion-qa/reel-motion.mp4 /tmp/qa/
          git checkout --orphan qa-reel
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/qa/reel-motion.mp4 .
          git add reel-motion.mp4
          git commit -q -m "Reel motion de QA (nao e publicacao)"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin qa-reel
