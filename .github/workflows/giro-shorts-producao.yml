name: Giro Madeira - Shorts (sem API paga)

on:
  schedule:
    # Horarios em UTC; publica apenas filas vencidas, com controle de intervalo.
    - cron: '5,35 0,1,11,14,17,21,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: giro-shorts-production
  cancel-in-progress: false

jobs:
  gerar-short:
    if: github.repository == 'giromadeira-spec/giro-madeira-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Obter somente os arquivos do repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias gratuitas
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg fonts-dejavu-core
          command -v ffmpeg
          command -v ffprobe
          python -m py_compile scripts/giro_shorts_auto.py
      - name: Gerar Short apenas quando o Supabase autorizar
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/giro_shorts_auto.py
