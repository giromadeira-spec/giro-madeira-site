name: Giro Madeira - QA da imagem por IA (teste, sem publicar)

on:
  push:
    branches: [giro-ia-qa]
    paths: [.github/workflows/giro-ia-qa.yml, scripts/giro_broll.py]

permissions:
  contents: write

jobs:
  ia-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.31,<3"
      - name: Gerar 3 imagens de teste com IA gratuita
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/giro_broll.py ia-teste ia
      - name: Guardar resultado num ramo de teste
        run: |
          git config user.name "giro-qa"; git config user.email "qa@users.noreply.github.com"
          git checkout --orphan giro-ia-qa-out
          git rm -rf -q . || true
          cp -r ia-teste/* .
          git add relatorio.json *.jpg 2>/dev/null || git add relatorio.json
          git commit -q -m "resultado QA IA"
          git push -f origin giro-ia-qa-out
