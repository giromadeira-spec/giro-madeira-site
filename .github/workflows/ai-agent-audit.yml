name: Giro Madeira - laboratorio de agentes (sem publicar)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/test_ai_agents_*.py'
      - 'docs/**'
      - 'AGENTS.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/test_ai_agents_*.py'
      - 'docs/**'
      - 'AGENTS.md'
  schedule:
    # 07h17 Porto Velho / 08h17 Sao Paulo. GitHub pode atrasar o inicio.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      use_ai:
        description: 'Consultar dois agentes via API OpenAI (requer secret; pode gerar custos)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: giro-ai-agent-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auditoria:
    if: github.repository == 'giromadeira-spec/giro-madeira-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - name: Obter codigo sem permissoes de escrita
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias fixadas do laboratorio
        run: python -m pip install --disable-pip-version-check -r scripts/ai_agents/requirements.txt
      - name: Testar auditor offline
        run: python -m unittest discover -s tests -p 'test_ai_agents_*.py' -v
      - name: Executar LangGraph offline, sem publicar
        run: >-
          python scripts/ai_agents/orchestrate.py
          --task-id "${GITHUB_RUN_ID}-offline"
          --report artifacts/ai-agent-report.md
      - name: Conferir disponibilidade da chave sem revelar valor
        id: ai_preflight
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.use_ai == true) ||
          (github.event_name == 'schedule' &&
          (vars.GIRO_AGENT_AI_ENABLED == '' || vars.GIRO_AGENT_AI_ENABLED == 'true')) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[test-ai]'))) }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::IA diaria habilitada, aguardando secret OPENAI_API_KEY."
            printf '\n**IA pendente:** rotina habilitada; cadastrar OPENAI_API_KEY em Actions Secrets. Nenhuma chamada API realizada.\n' >> artifacts/ai-agent-report.md
          fi
      - name: Executar agentes com chave protegida (main confiavel)
        if: ${{ github.ref == 'refs/heads/main' && steps.ai_preflight.outputs.ready == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_AGENT_AUDIT_MODEL }}
        run: >-
          python scripts/ai_agents/orchestrate.py --use-ai
          --task-id "${GITHUB_RUN_ID}-ai"
          --report artifacts/ai-agent-report.md
      - name: Exibir diagnostico no resumo do Actions
        if: always()
        run: |
          if [ -f artifacts/ai-agent-report.md ]; then
            cat artifacts/ai-agent-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar relatorio (sem alterar producao)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giro-ai-agent-readonly-report
          path: |
            artifacts/ai-agent-report.md
            artifacts/ai-agent-checkpoints.sqlite
          if-no-files-found: ignore
          retention-days: 14
