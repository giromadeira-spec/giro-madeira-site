 const news=window.GIRO_CMS?await window.GIRO_CMS.mergedNews():(window.GIRO_NEWS||[]);const p=new URLSearchParams(location.search);const x=news.find(v=>v.id===p.get('id'))||news[0];if(!x){document.getElementById('article').innerHTML='<h1>Matéria não encontrada</h1>';return}
