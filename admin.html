<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redação | Giro Madeira</title>
  <link rel="icon" href="assets/logo-oficial.webp">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="admin-brand"><img src="assets/logo-oficial.webp" alt="Giro Madeira"><div><strong>GIRO MADEIRA</strong><span>Painel de Redação</span></div></div>
    <a href="index.html">Ver site</a>
  </header>
  <main class="admin-shell">
    <section id="login-panel" class="panel login-panel">
      <div><span class="tag">ACESSO RESTRITO</span><h1>Redação Giro Madeira</h1><p>Entre com seu usuário autorizado. Publicações e imagens entram pelo Supabase, sem novo deploy.</p></div>
      <form id="login-form"><label>E-mail<input id="login-email" type="email" required autocomplete="email"></label><label>Senha<input id="login-password" type="password" required autocomplete="current-password"></label><button type="submit">ENTRAR</button><div id="login-status" class="status"></div></form>
    </section>

    <section id="editor-panel" class="editor-layout hidden">
      <div class="editor-top"><div><span class="tag">REDAÇÃO</span><h1 id="form-heading">Nova matéria</h1></div><button id="logout" class="ghost" type="button">Sair</button></div>
      <form id="news-form" class="panel form-grid">
        <input id="edit-id" type="hidden">
        <label class="wide">Título<input id="title" required maxlength="180" placeholder="Manchete da matéria"></label>
        <label>Categoria<select id="category" required><option>PORTO VELHO</option><option>MUNICÍPIOS</option><option>RONDÔNIA</option><option>POLÍCIA</option><option>POLÍTICA</option><option>ECONOMIA</option><option>NEGÓCIOS</option><option>AGRO</option><option>SERVIÇO</option><option>EMPREGOS</option><option>CONCURSOS</option><option>SAÚDE</option><option>EDUCAÇÃO</option><option>ESPORTE</option><option>FUTEBOL</option><option>CULTURA</option><option>ENTRETENIMENTO</option><option>TV & NOVELAS</option><option>LIVROS</option><option>TECNOLOGIA</option><option>GAMES</option><option>TURISMO</option><option>VIAGEM</option><option>GASTRONOMIA</option><option>RESTAURANTES</option><option>CULINÁRIA</option><option>PETS</option><option>MEIO AMBIENTE</option><option>CLIMA</option><option>TRÂNSITO</option><option>JUSTIÇA</option><option>COMPORTAMENTO</option><option>CURIOSIDADES</option><option>BRASIL</option><option>MUNDO</option></select></label>
        <label>Kicker / chamada curta<input id="kicker" maxlength="100" placeholder="Ex.: ELEIÇÕES 2026 • RONDÔNIA"></label>
        <label class="wide">Resumo<textarea id="summary" required rows="3" maxlength="500" placeholder="Resumo que aparece na capa"></textarea></label>
        <label class="wide">Texto da matéria<textarea id="body" required rows="12" placeholder="Separe os parágrafos com uma linha em branco."></textarea></label>

        <div class="wide editorial-box">
          <label><span>Destaque da capa</span><select id="featured-rank"><option value="">Sem destaque fixo</option><option value="1">1 — Manchete principal</option><option value="2">2 — Destaque lateral</option><option value="3">3 — Destaque lateral</option></select></label>
          <label class="check"><input id="is-breaking" type="checkbox"><span>URGENTE / faixa “Agora”</span></label>
          <label class="check"><input id="is-service" type="checkbox"><span>Serviço / oportunidade</span></label>
        </div>

        <label>Publicar em<input id="publish-at" type="datetime-local"><small>Vazio = agora. Data futura = publicação agendada sem novo deploy.</small></label>
        <label>Expirar em<input id="expires-at" type="datetime-local"><small>Opcional. Útil para alertas, inscrições e serviços temporários.</small></label>

        <label>Fonte<input id="source-name" required placeholder="Ex.: TRE-RO"></label>
        <label>Link da fonte<input id="source-url" type="url" required placeholder="https://..."></label>
        <label class="wide">Foto da matéria<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG ou WEBP, até 6 MB.</small></label>
        <label class="wide">Ou URL de imagem<input id="image-url" type="url" placeholder="https://..."></label>
        <label class="wide">Crédito da imagem<input id="image-credit" maxlength="180" placeholder="Ex.: Divulgação / TRE-RO"></label>

        <div class="wide actions"><button id="cancel-edit" class="ghost hidden" type="button">CANCELAR EDIÇÃO</button><button id="save-draft" class="secondary" type="button">SALVAR RASCUNHO</button><button id="publish" type="submit">PUBLICAR / AGENDAR</button></div>
        <div id="form-status" class="wide status"></div>
      </form>

      <section class="panel recent"><div class="recent-head"><div><span class="tag">CONTEÚDO</span><h2>Matérias recentes</h2></div><button id="refresh-list" class="ghost" type="button">Atualizar</button></div><div id="recent-list"></div></section>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
