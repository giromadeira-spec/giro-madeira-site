[build]
  publish = "."

[[redirects]]
  from = "/apuracao"
  to = "/apuracao.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/apuracao.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[redirects]]
  from = "/futebol"
  to = "/futebol.html"
  status = 200

[[headers]]
  for = "/futebol.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
